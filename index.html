<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>ToolTime Facility Management</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#16324A" />
<meta name="color-scheme" content="light" />

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ToolTime" />
<link rel="icon" href="icons/icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  html { color-scheme: light; }
  html, body { margin: 0; padding: 0; background: #DCD9D0; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button, input, textarea { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>
<script src="app.bundle.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
